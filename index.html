<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Volumni List (TVL)</title>
    <!-- Import Fira Sans from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #070b12; 
            color: #e2e8f0; 
            font-family: 'Fira Sans', sans-serif; 
            max-width: 750px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }
        h1 { 
            text-align: center; 
            color: #0f52ba; 
            margin-bottom: 30px;
        }
        .level-card { 
            background: #0e1420; 
            border-left: 4px solid #0f52ba; 
            padding: 18px; 
            margin: 15px 0; 
            border-radius: 6px; 
        }
        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .level-info h3 { 
            margin: 0 0 4px 0; 
            font-size: 20px; 
        }
        .level-info p { 
            margin: 0; 
            color: #94a3b8; 
            font-size: 14px; 
        }
        .btn { 
            background: #0f52ba; 
            color: white; 
            padding: 6px 14px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-size: 14px; 
            font-weight: 500;
        }
        .btn:hover { background: #1967d2; }
        .records-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #1a2234;
            font-size: 13px;
            color: #cbd5e1;
        }
        .records-section h4 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #070b12;
            padding: 6px 10px;
            margin: 4px 0;
            border-radius: 4px;
        }
        .record-item a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .record-item a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>The Volumni List (TVL)</h1>
    <div id="list">Loading levels...</div>

    <script>
        fetch('levels.json')
            .then(res => res.json())
            .then(levels => {
                const list = document.getElementById('list');
                if (levels.length === 0) {
                    list.innerHTML = '<p style="text-align:center; color:#94a3b8;">No levels added yet.</p>';
                    return;
                }
                
                list.innerHTML = '';
                levels.forEach(lvl => {
                    let recordsHTML = '';
                    if (lvl.records && lvl.records.length > 0) {
                        recordsHTML = `<div class="records-section">
                            <h4>Victors (${lvl.records.length})</h4>`;
                        lvl.records.forEach(r => {
                            let deviceText = r.mobile ? 'Mobile' : 'PC';
                            recordsHTML += `
                                <div class="record-item">
                                    <span><strong>${r.player}</strong> &bull; ${r.hz} &bull; ${deviceText}</span>
                                    <a href="${r.video}" target="_blank">Proof</a>
                                </div>
                            `;
                        });
                        recordsHTML += `</div>`;
                    } else {
                        recordsHTML = `<div class="records-section"><p style="color: #475569; margin: 4px 0; font-style: italic;">No records submitted yet.</p></div>`;
                    }

                    list.innerHTML += `
                        <div class="level-card">
                            <div class="level-header">
                                <div class="level-info">
                                    <h3>#${lvl.position} - ${lvl.name}</h3>
                                    <p>By ${lvl.creator} &bull; Verified by ${lvl.verifier} &bull; <span style="color: #60a5fa; font-weight: 500;">${lvl.difficulty}</span></p>
                                </div>
                                <a class="btn" href="${lvl.video}" target="_blank">YouTube</a>
                            </div>
                            ${recordsHTML}
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('list').innerHTML = '<p style="color:#ef4444; text-align:center;">Error loading levels.json</p>';
            });
    </script>

</body>
</html>
